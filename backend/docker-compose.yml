services:
  mongo:
    image: mongo:7
    container_name: support-tickets-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-tickets-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/support_tickets
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 20
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@support.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}

volumes:
  mongo_data:

